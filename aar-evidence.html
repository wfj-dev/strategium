<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Mission Evidence | Watch Fortress Jericho</title>
<style>
:root { color-scheme: dark; --green: #4fd67a; --gold: #cfae68; --border: #2f6641; }
* { box-sizing: border-box; }
body { margin: 0; background: repeating-linear-gradient(0deg, #080d09 0 2px, #060a07 2px 4px); color: #f2ede0; font-family: monospace; }
main { max-width: 680px; margin: 0 auto; padding: 24px 18px; }
header { display: flex; gap: 12px; align-items: center; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
header img { width: 40px; height: 40px; }
h1 { font-size: 20px; color: var(--gold); margin: 24px 0 18px; }
header strong { color: var(--gold); font-size: 14px; }
.picker { position: relative; display: flex; align-items: center; justify-content: center; min-height: 68px; border: 1px dashed var(--green); background: #0b1d10; color: var(--green); cursor: pointer; }
.picker input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.picker:focus-within { outline: 2px solid var(--gold); }
.limits { color: #739b7c; font-size: 12px; line-height: 1.5; }
#previews { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin: 18px 0; }
#previews img { display: block; width: 100%; height: 100px; object-fit: contain; border: 1px solid var(--border); }
#status { color: var(--green); line-height: 1.5; overflow-wrap: anywhere; }
#status.error { color: #e05c4f; }
</style>
</head>
<body>
<main>
  <header><img src="/assets/jericho-symbol.webp" alt=""><strong>Watch Fortress Jericho</strong></header>
  <h1>Mission Evidence</h1>
  <label class="picker"><span>+ Choose Screenshots</span><input id="screenshots" type="file" accept="image/png,image/jpeg,image/webp" multiple aria-label="Choose screenshots" disabled></label>
  <p class="limits">PNG, JPEG, WebP · <span id="image-limit">Discord limit</span> each · Up to 10 images / 32 MiB</p>
  <div id="previews"></div>
  <p id="status" role="status" aria-live="polite">Opening evidence link...</p>
</main>
<script>
const parts = location.hash.slice(1).split('.');
const sessionId = parts[0] || '';
const token = parts[1] || '';
const requestedImageLimit = Number(new URLSearchParams(location.search).get('max_file_bytes'));
const maxImageBytes = Number.isInteger(requestedImageLimit) && requestedImageLimit > 0
  ? Math.min(requestedImageLimit, 32 * 1024 * 1024)
  : 32 * 1024 * 1024;
document.getElementById('image-limit').textContent = `${Math.ceil(maxImageBytes / (1024 * 1024))} MiB`;
history.replaceState(null, '', location.pathname);
const input = document.getElementById('screenshots');
const status = document.getElementById('status');
let uploadedCount = 0;
let uploadedBytes = 0;
function report(message, error = false) {
  status.textContent = message;
  status.classList.toggle('error', error);
}
if (!/^[A-Za-z0-9_-]+$/.test(sessionId) || !/^[A-Za-z0-9_-]{32,}$/.test(token)) {
  report('This evidence link is unavailable. Open a new link from your AAR draft.', true);
} else {
  input.disabled = false;
  report('Evidence link open.');
}
input.addEventListener('change', async () => {
  const files = Array.from(input.files || []);
  if (!files.length) return;
  if (uploadedCount + files.length > 10 || uploadedBytes + files.reduce((sum, file) => sum + file.size, 0) > 32 * 1024 * 1024) {
    report('Too many screenshots or combined size exceeds 32 MiB.', true);
    input.value = '';
    return;
  }
  if (files.some(file => !['image/png', 'image/jpeg', 'image/webp'].includes(file.type) || !file.size || file.size > maxImageBytes)) {
    report(`Use PNG, JPEG, or WebP screenshots up to ${Math.ceil(maxImageBytes / (1024 * 1024))} MiB each.`, true);
    input.value = '';
    return;
  }
  input.disabled = true;
  try {
    for (const file of files) {
      report(`Uploading screenshot ${uploadedCount + 1}...`);
      const response = await fetch(`/api/aar-evidence/${sessionId}/upload`, {
        method: 'POST', credentials: 'omit', headers: {Authorization: `Bearer ${token}`, 'Content-Type': file.type}, body: file
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error === 'handoff_expired' ? 'The link has expired or was closed. Open a new link from the desktop draft.' : result.error || 'Screenshot upload failed.');
      uploadedCount += 1;
      uploadedBytes += file.size;
      const preview = document.createElement('img');
      const url = URL.createObjectURL(file);
      preview.src = url;
      preview.alt = file.name;
      preview.onload = () => URL.revokeObjectURL(url);
      document.getElementById('previews').append(preview);
    }
    report(`${uploadedCount} screenshot${uploadedCount === 1 ? '' : 's'} delivered to the AAR draft.`);
  } catch (error) {
    report(error.message || 'Screenshot upload failed.', true);
  } finally {
    input.disabled = false;
    input.value = '';
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Fortress Jericho — Strategium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060706;
    --panel: #0c100c;
    --panel-2: #111611;
    --border: rgba(79, 214, 122, 0.32);
    --border-dim: rgba(79, 214, 122, 0.14);
    --green: #4fd67a;
    --green-dim: #2f8a52;
    --green-faint: #1f5c38;
    --gold: #cfae68;
    --gold-dim: #8f753e;
    --white: #f2ede0;
    --red: #e05c4f;
    --red-dim: #7a3129;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
  }

  h1, h2, .display { font-family: 'Cinzel', serif; }
  button { font-family: inherit; }

  .page { max-width: 1180px; margin: 0 auto; padding: 22px 24px 60px; }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; border-bottom: 1px solid var(--border-dim); padding-bottom: 16px; margin-bottom: 24px;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .header-icon {
    width: 44px; height: 44px; flex-shrink: 0;
    border: 1px solid var(--gold-dim); background: #0a0a09;
    display: flex; align-items: center; justify-content: center; color: var(--gold);
  }
  .header-icon svg { width: 23px; height: 23px; }
  .header-title {
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 22px;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--gold);
    margin: 0; line-height: 1.1;
  }
  .header-sub {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--green-dim); margin-top: 5px;
  }

  .header-right { display: flex; align-items: center; gap: 10px; }
  .auth-badge {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; padding: 5px 10px; border: 1px solid var(--border-dim);
    color: var(--green); text-transform: uppercase; letter-spacing: 0.05em;
    background: rgba(79,214,122,0.03);
  }
  .auth-badge-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }
  .auth-btn {
    background: transparent; border: 1px solid var(--gold-dim); color: var(--gold);
    padding: 5px 12px; cursor: pointer; font-family: inherit; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.15s;
  }
  .auth-btn:hover { background: rgba(207,174,104,0.1); border-color: var(--gold); }
  .auth-btn-logout { border-color: var(--border-dim); color: var(--green-dim); font-size: 10px; padding: 3px 7px; margin-left: 4px; }
  .auth-btn-logout:hover { border-color: var(--red-dim); color: var(--red); background: rgba(224,92,79,0.08); }

  .icon-btn {
    background: transparent; border: 1px solid var(--border-dim); color: var(--green-dim);
    width: 32px; height: 32px; cursor: pointer; font-size: 14px; line-height: 1;
    transition: color 0.15s, border-color 0.15s;
  }
  .icon-btn:hover { color: var(--green); border-color: var(--green); }

  .slate {
    position: relative;
    border: 1px solid var(--border);
    background: rgba(79,214,122,0.015);
    box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 0 30px rgba(79,214,122,0.04);
    padding: 40px 30px 46px;
  }
  .hud-bracket { position: absolute; width: 16px; height: 16px; border: 0 solid var(--green); pointer-events: none; }
  .hud-bracket.tl { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
  .hud-bracket.tr { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
  .hud-bracket.bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
  .hud-bracket.br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

  .slate-corner { position: absolute; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
  .slate-corner.tl { top: 10px; left: 18px; color: var(--green-dim); }
  .slate-corner.tr { top: 10px; right: 18px; color: var(--gold-dim); }

  #breadcrumb {
    display: flex; align-items: center; gap: 6px; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.06em; margin: 18px 0 30px; flex-wrap: wrap;
    color: var(--green-dim);
  }
  #breadcrumb::before { content: ">"; color: var(--green); margin-right: 2px; }
  .crumb { background: none; border: none; color: var(--green-dim); cursor: pointer; padding: 2px 0; font-family: inherit; font-size: inherit; letter-spacing: inherit; }
  .crumb:hover { color: var(--green); }
  .crumb-current { color: var(--gold); }
  .crumb-sep { color: var(--green-faint); }

  #app { animation: none; }
  #app.zoom-in { animation: zoomIn 380ms cubic-bezier(.16,.84,.32,1); }
  @keyframes zoomIn {
    0% { transform: scale(0.2); opacity: 0.05; }
    50% { opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  #app.zoom-out { animation: zoomOut 340ms cubic-bezier(.16,.84,.32,1); }
  @keyframes zoomOut {
    0% { transform: scale(1.18); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .tier-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--gold-dim); margin: 6px 0 16px; display: flex; align-items: center; gap: 10px;
  }
  .tier-label::after { content: ""; flex: 1; height: 1px; background: var(--border-dim); }

  .tier { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .tier-apex { justify-content: center; }

  .connector-down { width: 1px; height: 22px; background: var(--border); margin: 2px auto 0; }

  .tree-row { position: relative; padding-top: 20px; }
  .tree-row::before { content: ""; position: absolute; top: 0; left: 12%; right: 12%; height: 1px; background: var(--border); }
  .tree-row > * { position: relative; }
  .tree-row > *::before { content: ""; position: absolute; top: -20px; left: 50%; width: 1px; height: 20px; background: var(--border); transform: translateX(-50%); }
  @media (max-width: 640px) {
    .tree-row::before, .tree-row > *::before { display: none; }
    .tree-row { padding-top: 0; }
  }

  .branch-row {
    position: relative; display: flex; gap: 30px; justify-content: center;
    align-items: flex-start; flex-wrap: wrap; padding-top: 22px;
  }
  .branch-row::before { content: ""; position: absolute; top: 0; left: 18%; right: 18%; height: 1px; background: var(--border); }
  .branch { position: relative; flex: 1 1 380px; max-width: 480px; }
  .branch::before { content: ""; position: absolute; top: -22px; left: 50%; width: 1px; height: 22px; background: var(--border); transform: translateX(-50%); }
  .branch-title {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--gold); text-align: center; margin: 0 0 14px;
  }
  .branch-body { border: 1px solid var(--border-dim); background: rgba(79,214,122,0.015); padding: 18px 14px; }
  @media (max-width: 640px) {
    .branch-row::before, .branch::before { display: none; }
    .branch-row { padding-top: 0; gap: 20px; }
  }

  .fortress-map {
    position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); max-width: 900px; margin: 0 auto;
    grid-template-rows: auto 26px auto 30px auto; gap: 0 9px; align-items: start;
    padding: 8px 0 4px; isolation: isolate;
  }
  .fortress-map::before {
    content: ""; position: absolute; z-index: -1; left: 3%; right: 3%; top: 58px; bottom: 20px;
    border-top: 1px solid var(--border-dim); border-bottom: 1px solid var(--border-dim);
    background: rgba(79,214,122,0.012);
  }
  .map-command, .map-node { position: relative; z-index: 1; min-width: 0; }
  .map-command { grid-column: 3; grid-row: 1; }
  .map-command::before, .map-command::after, .map-node::before, .map-node::after,
  .map-branch::before, .map-branch::after, .company-slot::before { display: none; }
  .map-node .formation-plate, .map-node .company-plate {
    width: 100%; min-width: 0; max-width: none; height: 92px; padding: 10px 9px 11px;
  }
  .map-node .formation-plate-label, .map-node .company-plate-label { font-size: 12px; }
  .map-node .formation-plate-lead, .map-node .company-plate-captain { font-size: 10px; }
  .map-node .formation-plate-count, .map-node .company-plate-count { font-size: 9px; }
  .map-node .company-sigil { right: 6px; top: 6px; width: 19px; height: 19px; }
  .map-node .company-sigil svg { width: 18px; height: 18px; }
  .formation-slot-armory { grid-column: 1; grid-row: 1; }
  .formation-slot-apothecarion { grid-column: 5; grid-row: 1; }
  .formation-slot-black_vault { grid-column: 2; grid-row: 3; }
  .formation-slot-librarius { grid-column: 3; grid-row: 3; }
  .formation-slot-reclusiam { grid-column: 4; grid-row: 3; }
  .formation-slot-hall_of_blades { grid-column: 5; grid-row: 3; }
  .formation-slot-armory::before, .formation-slot-apothecarion::before,
  .formation-slot-armory::after, .formation-slot-apothecarion::after { display: none; }
  .map-middle-bus, .map-branch { display: none; }
  .map-connectors {
    position: absolute; z-index: 0; inset: 0; width: 100%; height: 100%;
    overflow: visible; pointer-events: none;
  }
  .map-connectors line, .map-connectors path {
    fill: none; stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke;
  }
  .company-slot-1 { grid-column: 1; grid-row: 5; }
  .company-slot-2 { grid-column: 2; grid-row: 5; }
  .company-slot-3 { grid-column: 3; grid-row: 5; }
  .company-slot-4 { grid-column: 4; grid-row: 5; }
  .company-slot-5 { grid-column: 5; grid-row: 5; }
  .company-slot::before {
    content: ""; position: absolute; left: 50%; top: -30px; width: 1px; height: 30px;
    background: var(--border); transform: translateX(-50%);
  }
  @media (max-width: 900px) {
    .fortress-map { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0 7px; }
    .map-command { grid-column: 3; }
    .formation-slot-armory { grid-column: 1; }
    .formation-slot-apothecarion { grid-column: 5; }
    .formation-slot-black_vault { grid-column: 1; }
    .formation-slot-librarius { grid-column: 2; }
    .formation-slot-reclusiam { grid-column: 4; }
    .formation-slot-hall_of_blades { grid-column: 5; }
    .map-branch { grid-column: 1 / 6; }
    .company-slot-1 { grid-column: 1; }
    .company-slot-2 { grid-column: 2; }
    .company-slot-3 { grid-column: 3; }
    .company-slot-4 { grid-column: 4; }
    .company-slot-5 { grid-column: 5; }
  }
  @media (max-width: 600px) {
    .fortress-map { display: block; padding: 4px 0 0; }
    .fortress-map::before, .map-connectors { display: none; }
    .map-command { display: flex; justify-content: center; margin-bottom: 14px; }
    .map-node { margin-top: 9px; }
    .map-node::before { display: none; }
    .map-node .formation-plate, .map-node .company-plate { width: 100%; height: 62px; padding: 9px 12px; }
    .map-node .formation-plate-lead, .map-node .company-plate-captain { display: none; }
    .map-node .formation-plate-label, .map-node .company-plate-label { font-size: 13px; }
    .map-node .formation-plate-count, .map-node .company-plate-count { font-size: 10px; }
  }

  /* Compact schematic layout: three command nodes, four inner nodes, one company rail. */
  .fortress-map {
    display: block; max-width: 900px; margin: 0 auto; padding: 8px 0 4px;
  }
  .fortress-map::before { display: none; }
  .map-top, .map-middle, .map-company-row { display: grid; align-items: start; gap: 16px; }
  .map-top { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .map-middle { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 18px; }
  .map-company-row { grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 62px; }
  .map-top .map-command { grid-column: 2 / 4; grid-row: 1; }
  .map-top .formation-slot-armory { grid-column: 1; grid-row: 1; }
  .map-top .formation-slot-apothecarion { grid-column: 4; grid-row: 1; }
  .map-middle .formation-slot-black_vault { grid-column: 1; grid-row: 1; }
  .map-middle .formation-slot-librarius { grid-column: 2; grid-row: 1; }
  .map-middle .formation-slot-reclusiam { grid-column: 3; grid-row: 1; }
  .map-middle .formation-slot-hall_of_blades { grid-column: 4; grid-row: 1; }
  .map-company-row .company-slot { grid-row: 1; }
  .map-company-row .company-slot-1 { grid-column: 1; }
  .map-company-row .company-slot-2 { grid-column: 2; }
  .map-company-row .company-slot-3 { grid-column: 3; }
  .map-company-row .company-slot-4 { grid-column: 4; }
  .map-company-row .company-slot-5 { grid-column: 5; }
  .map-connectors { display: block; }
  .map-top > .map-node, .map-top > .map-command { min-width: 0; }
  .map-top .formation-plate, .map-top .map-command .plate {
    width: 100%; min-width: 0; max-width: none; height: 92px; padding: 10px 9px 11px;
  }
  .map-top .map-command { height: 97px; display: flex; justify-content: center; }
  .map-top .map-command .plate.size-lg {
    width: 50%; min-width: 0; height: 92px; padding: 10px 9px 11px; align-self: center;
  }
  .map-top .plate-name { font-size: 16px; }
  @media (max-width: 600px) {
    .fortress-map { display: block; max-width: none; }
    .map-connectors { display: none; }
    .map-top, .map-middle, .map-company-row { display: block; margin-top: 0; }
    .map-node { margin-top: 9px; }
    .map-top .map-command { margin-top: 0; }
  }

  .plate {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border-dim);
    padding: 10px 14px 12px;
    min-width: 150px; max-width: 200px;
    text-align: left; display: flex; flex-direction: column; gap: 3px;
    cursor: pointer; color: var(--green);
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  }
  .plate:hover:not(:disabled) { border-color: var(--green); box-shadow: 0 0 12px rgba(79,214,122,0.15); transform: translateY(-2px); }
  .plate:active:not(:disabled) { transform: translateY(0) scale(0.98); }
  .plate:disabled { cursor: default; }

  .plate-rank { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--green-dim); }
  .plate-name { font-weight: 700; font-size: 14.5px; color: var(--white); }
  .plate-sub { font-size: 10.5px; color: var(--green-faint); }

  .plate.accent-gold { border-left: 3px solid var(--gold); }
  .plate.accent-gold .plate-rank { color: var(--gold); }
  .plate.accent-steel { border-left: 3px solid var(--green-dim); }
  .plate.accent-red { border-left: 3px solid var(--green); }
  .plate.accent-red .plate-rank { color: var(--green); }

  .plate.vacant { border-style: dashed; opacity: 0.55; }
  .plate.vacant .plate-name { color: var(--green-faint); font-style: italic; font-weight: 400; }

  .company-plate.unit-unformed, .formation-plate.unit-unformed {
    border-style: dashed;
    border-color: rgba(79, 214, 122, 0.12);
    background: rgba(6, 10, 6, 0.4);
    opacity: 0.5;
    filter: grayscale(0.65);
  }
  .company-plate.unit-unformed:hover, .formation-plate.unit-unformed:hover {
    opacity: 0.85;
    filter: none;
    border-style: solid;
  }
  .unit-unformed-tag {
    font-size: 9.5px;
    color: var(--green-faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-style: italic;
  }
  .unit-dormant-banner {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: rgba(224, 92, 79, 0.04); border: 1px dashed var(--border-dim);
    padding: 12px 18px; margin: 10px auto 28px; font-size: 11.5px;
    letter-spacing: 0.06em; color: var(--green-dim); text-transform: uppercase;
    max-width: 680px; text-align: center;
  }
  .unit-dormant-tag {
    color: var(--gold-dim); border: 1px solid var(--gold-dim); padding: 1px 6px; font-weight: 700;
  }

  .plate.size-lg { min-width: 240px; padding: 16px 20px 18px; }
  .plate.size-lg .plate-name { font-size: 19px; }
  .plate.size-md { min-width: 190px; }

  .tier-companies { max-width: 900px; margin: 0 auto; }

  .company-plate {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border-dim);
    border-top: 2px solid var(--gold-dim);
    padding: 14px 16px 16px;
    min-width: 172px; flex: 1 1 172px; max-width: 212px;
    text-align: left; display: flex; flex-direction: column; gap: 5px;
    cursor: pointer; color: var(--green);
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  }
  .company-plate:hover { border-color: var(--gold); box-shadow: 0 0 14px rgba(207,174,104,0.15); transform: translateY(-3px); }
  .company-plate:active { transform: translateY(-1px) scale(0.98); }
  .company-plate-label {
    font-family: 'Cinzel', serif; font-weight: 600; font-size: 14.5px; letter-spacing: 0.02em; color: var(--white);
    border-bottom: 1px solid var(--border-dim); padding-bottom: 6px; margin-bottom: 2px;
  }
  .company-plate-captain { font-size: 12.5px; color: var(--green); }
  .company-plate-count { font-size: 10.5px; color: var(--green-faint); }

  .company-sigil {
    position: absolute; top: 8px; right: 10px;
    width: 24px; height: 24px; border-radius: 50%;
    background: #030303; color: #d8352b;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #3a3a3a;
  }
  .company-sigil svg { width: 15px; height: 15px; }

  .company-header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .company-sigil-lg {
    width: 48px; height: 48px; border-radius: 50%;
    background: #030303; color: #d8352b;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #3a3a3a; flex-shrink: 0;
  }
  .company-sigil-lg svg { width: 27px; height: 27px; }
  .company-header-title {
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 20px; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--white); margin: 0 0 2px;
  }
  .company-header-sub { font-size: 11.5px; color: var(--green-dim); }

  .company-note {
    font-size: 11.5px; color: var(--green-faint); font-style: italic;
    margin: 4px auto 28px; text-align: center; max-width: 640px;
  }

  .tier-formations { max-width: 920px; margin: 0 auto; }

  .formation-plate {
    background: var(--panel);
    border: 1px solid var(--border-dim);
    border-top: 3px solid var(--formation-accent, var(--green-dim));
    padding: 14px 16px 16px;
    min-width: 172px; flex: 1 1 172px; max-width: 212px;
    text-align: left; display: flex; flex-direction: column; gap: 5px;
    cursor: pointer; color: var(--green);
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  }
  .formation-plate:hover { border-color: var(--formation-accent, var(--green)); box-shadow: 0 0 14px rgba(79,214,122,0.15); transform: translateY(-3px); }
  .formation-plate:active { transform: translateY(-1px) scale(0.98); }
  .formation-plate-label {
    font-family: 'Cinzel', serif; font-weight: 600; font-size: 14px; letter-spacing: 0.02em; color: var(--white);
    border-bottom: 1px solid var(--border-dim); padding-bottom: 6px; margin-bottom: 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .formation-plate-label::before {
    content: ""; width: 9px; height: 9px; border-radius: 50%;
    background: var(--formation-accent, var(--green-dim)); border: 1px solid rgba(255,255,255,0.25); flex-shrink: 0;
  }
  .formation-plate-lead { font-size: 12px; color: var(--green); }
  .formation-plate-count { font-size: 10.5px; color: var(--green-faint); }

  .formation-tier-label { display: flex; align-items: center; gap: 10px; }
  .formation-tier-label::before {
    content: ""; order: -1; width: 11px; height: 11px; border-radius: 50%;
    background: var(--formation-accent, var(--green-dim)); border: 1px solid rgba(255,255,255,0.25); flex-shrink: 0;
  }

  .tier-formation-lead { margin-bottom: 30px; justify-content: flex-start; }

  .formation-lore, .company-lore {
    max-width: 700px; margin: 0 auto 24px; color: var(--green-dim);
    font-size: 12px; line-height: 1.65; text-align: center;
  }

  .tier-killteams { max-width: 760px; margin: 0 auto; }

  .killteam-plate {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border-dim);
    border-left: 3px solid var(--green);
    padding: 12px 15px;
    min-width: 200px; flex: 1 1 200px; max-width: 240px;
    text-align: left; display: flex; flex-direction: column; gap: 4px;
    cursor: pointer; color: var(--green);
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  }
  .killteam-plate:hover { border-color: var(--green); box-shadow: 0 0 12px rgba(79,214,122,0.15); transform: translateY(-2px); }
  .killteam-plate:active { transform: translateY(0) scale(0.98); }

<script>
/* ==========================================================================
   WATCH FORTRESS JERICHO — STRATEGIUM DISPLAY
   ==========================================================================
   Two structures sit side by side under the Watch Master:
     - Five Watch Companies (Primus..Quintus), each its own Captain,
       Lieutenant, and four Kill Teams.
     - Six Specialist Formations, fortress-wide and independent of company
       lines: The Armory, Librarius, The Reclusiam, The Apothecarion,
       Hall of Blades, and The Black Vault.

   DATA CONTRACT for live integration:
   Point "Data Source URL" (gear icon) at any endpoint returning JSON:
     { "members": [
         { "id": "m001", "name": "...", "chapter": "...", "rank": "watch_master",
           "company": null, "killTeam": null, "formation": null,
           "title": null, "vigil": "...", "backstory": "..." },
         ...
     ] }
   rank must be one of the RANK_LABELS keys below.
   company is 1-5 (Primus..Quintus) or null.
   killTeam is "<company>-<1..4>" or null.
   formation is one of: armory, librarius, reclusiam, apothecarion,
     hall_of_blades, black_vault — or null.
  title is an optional free-text honorific (or null). backstory is free
  text, up to ~400 words. stats is an optional object of displayable values,
  for example { "strength": 8, "toughness": 7 }.
   This is the same shape a Discord-role-mapping export or a bot endpoint
   should produce — see the settings panel in-app for the full note.
   ========================================================================== */

const RANK_LABELS = {
  watch_master: "Watch Master",
  forgemaster: "Forge Master",
  void_warden: "Void Warden",
  chief_apothecary: "Chief Apothecary",
  high_chaplain: "High Chaplain",
  blade_master: "Blade Master",
  huntmaster: "Hunt Master",
  venerable_dreadnought: "Venerable Dreadnought",
  honored_dreadnought: "Honored Dreadnought",
  watch_captain: "Watch Captain",
  watch_lieutenant: "Watch Lieutenant",
  first_blade: "First Blade",
  techmarine: "Techmarine",
  librarian: "Watch Librarian",
  apothecary: "Watch Apothecary",
  chaplain: "Watch Chaplain",
  dreadnought: "Dreadnought",
  kill_marine: "Kill Marine",
  watch_sergeant: "Watch Sergeant",
  veteran_sergeant: "Veteran Sergeant",
  watch_veteran: "Watch Veteran",
  watch_brother: "Watch Brother",
  oathsworn: "Oathsworn",
  blade_guard: "Blade Guard"
};

/* The six specialist Formations. Independent of the five Watch Companies,
   each led directly by its own High Command officer. */
const FORMATIONS = {
  armory: { name: "Armory", lead: "forgemaster", ranks: ["techmarine", "dreadnought", "honored_dreadnought"] },
  librarius: { name: "Librarius", lead: "void_warden", ranks: ["librarian"] },
  reclusiam: { name: "Reclusiam", lead: "high_chaplain", ranks: ["chaplain"] },
  apothecarion: { name: "Apothecarion", lead: "chief_apothecary", ranks: ["apothecary"] },
  hall_of_blades: { name: "Hall of Blades", lead: "blade_master", ranks: ["first_blade", "blade_guard"] },
  black_vault: { name: "Black Vault", lead: "huntmaster", ranks: ["kill_marine"] }
};

const FORMATION_LORE = {
  armory: "The Armory keeps the Fortress armed, repaired, and ready. Its artificers maintain the wargear that lets every other formation answer the next summons.",
  librarius: "The Librarius guards the Watch's memory and forbidden knowledge. Its seers read threats before they become movements on the tactical slate.",
  reclusiam: "The Reclusiam tends the oaths that bind the Long Watch together. Its chaplains keep purpose intact when duty outlasts certainty.",
  apothecarion: "The Apothecarion preserves the warriors who stand the Vigil. Its apothecaries serve as surgeons, custodians of gene-seed, and witnesses to sacrifice.",
  hall_of_blades: "The Hall of Blades is the Fortress's close-combat reserve. Its veterans turn discipline, timing, and controlled violence into a second wall around the Watch.",
  black_vault: "The Black Vault holds the hunters and instruments too dangerous to leave unaccounted. Its operatives are released only when the threat warrants the risk."
};

const COMPANY_LORE = {
  1: "Company Primus forms the first line of the Watch's rotating strike force.",
  2: "Company Secundus carries the Vigil into the Reach wherever a second spear is needed.",
  3: "Company Tertius is a flexible battle line, ready to reinforce a failing front or open a new one.",
  4: "Company Quartus keeps its kill-teams moving between alert stations and active war zones.",
  5: "Company Quintus stands ready for the missions that require endurance after the first companies have been committed."
};

const FORMATION_LEAD_RANKS = Object.values(FORMATIONS).map(f => f.lead);
const FORMATION_MEMBER_RANKS = Object.values(FORMATIONS).flatMap(f => f.ranks).concat(["venerable_dreadnought"]);

const COMPANY_COMMAND_RANKS = ["watch_captain", "watch_lieutenant"];
const KILL_TEAM_LEAD_RANKS = ["watch_sergeant", "veteran_sergeant"];
const KILL_TEAM_ROSTER_RANKS = ["watch_brother", "watch_veteran", "oathsworn"];

const COMPANY_NAMES = { 1: "Primus", 2: "Secundus", 3: "Tertius", 4: "Quartus", 5: "Quintus" };

/* Exact Watch Company markings: a black circle, plain for Primus, marked
   with a red line for the others — horizontal (Secundus), vertical
   (Tertius), diagonal NW-SE (Quartus), diagonal NE-SW (Quintus). */
const COMPANY_MARKINGS = { 1: "I", 2: "II", 3: "III", 4: "IV", 5: "V" };

const COMPANY_SIGILS = {
  1: '<svg viewBox="0 0 24 24"></svg>',
  2: '<svg viewBox="0 0 24 24"><line x1="0" y1="12" x2="24" y2="12" stroke="currentColor" stroke-width="10"/></svg>',
  3: '<svg viewBox="0 0 24 24"><line x1="12" y1="0" x2="12" y2="24" stroke="currentColor" stroke-width="10"/></svg>',
  4: '<svg viewBox="0 0 24 24"><line x1="4.5" y1="4.5" x2="19.5" y2="19.5" stroke="currentColor" stroke-width="10"/></svg>',
  5: '<svg viewBox="0 0 24 24"><line x1="19.5" y1="4.5" x2="4.5" y2="19.5" stroke="currentColor" stroke-width="10"/></svg>'
};

/* Specialist Formation colours. */
const FORMATION_COLORS = {
  armory: "#c0392b",
  librarius: "#3f6fb0",
  reclusiam: "#2a2a2a",
  apothecarion: "#eeeae0",
  hall_of_blades: "#c9a04a",
  black_vault: "#5c5c5c"
};

/* Late M42 is the default display anchor; the setting can be changed when a
   more precise Imperial calendar year is chosen for the campaign. */
const CURRENT_IMPERIAL_YEAR = 41999;

/* ---------------------------------------------------------------------- */
/* Sample roster generator — clearly placeholder data for demo purposes.  */
/* ---------------------------------------------------------------------- */

const FIRST_NAMES = ["Kaelen","Thorne","Bracus","Dorian","Varyn","Sten","Mordan","Aric",
  "Cassian","Renn","Joran","Halkin","Voss","Draven","Corvin","Talon","Garrick","Soren",
  "Erevan","Kellis","Malric","Ostren","Bram","Ivor","Rurik","Cael","Anselm","Dagren",
  "Piet","Ansen"];
const SURNAMES = ["Vahl","Kreig","Ostmark","Halvard","Serrun","Kant","Vireth","Dorn",
  "Aurel","Brasca","Icarion","Whist","Corvane","Talbec","Renard","Skarn","Ulric","Faron",
  "Kesh","Adric","Volgren","Ashworth","Cyrix","Braun","Deverel","Norrick","Sable","Thurn",
  "Marrow","Idris"];
const CHAPTERS = ["Hawk Lords","Ultramarines","Imperial Fists","Blood Angels","Salamanders",
  "Raven Guard","White Scars","Space Wolves","Iron Hands","Crimson Fists","Black Templars",
  "Star Phantoms","Marines Errant","Novamarines","Astral Claws","Executioners"];

function seededPick(arr, seed) {
  return arr[seed % arr.length];
}

function makeName(seed) {
  return `${seededPick(FIRST_NAMES, seed)} ${seededPick(SURNAMES, seed * 7 + 3)}`;
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}

function formationName(m) {
  const f = FORMATIONS[m.formation];
  return f ? f.name : "Fortress";
}

/* ---------------------------------------------------------------------- */
/* Dossier / backstory generator — placeholder flavor text for sample     */
/* data. Live data can carry its own `backstory` field (up to ~400 words) */
/* and it will be used as-is instead of any of this.                      */
/* ---------------------------------------------------------------------- */

const PLANETS = ["Kaldris Reach", "the Ashfall Moons", "Vantor's Landing", "the Threnody Belt",
  "Coeval Station", "the Obsidian Shoals", "Drennic's Hollow", "the Pale Anchorage"];
const THREATS = ["orks", "tyranid bio-forms", "necron constructs", "chaos raiders",
  "eldar corsairs", "an unclassified xenos strain", "drukhari reavers"];
const CAMPAIGNS = ["the Achilus Crusade", "the Jericho-Maw containment action",
  "the Ghosar Quintus reprisal", "a campaign still sealed by the Ordo Xenos"];

function categorize(m) {
  if (m.rank === "watch_master") return "apex";
  if (FORMATION_LEAD_RANKS.includes(m.rank)) return "hq";
  if (m.rank === "venerable_dreadnought") return "hq";
  if (m.rank === "watch_captain" || m.rank === "watch_lieutenant") return "company_lead";
  if (KILL_TEAM_LEAD_RANKS.includes(m.rank)) return "kill_lead";
  if (FORMATION_MEMBER_RANKS.includes(m.rank)) return "specialist";
  return "roster";
}

const CATEGORY_FRAGMENTS = {
  apex: {
    opening: [
      m => `${m.name} has held the Strategium of Watch Fortress Jericho longer than most of its Astartes have served under it, a Watch Master trusted with the burden of many Chapters at once.`,
      m => `Before the black armour, ${m.name} bore the colours of the ${m.chapter}, and something of that Chapter's bearing has never quite left the Watch Master's manner.`

function makeBackstory(m) {
  const seed = hashStr(m.id);
  const pools = CATEGORY_FRAGMENTS[categorize(m)];
  const planet = seededPick(PLANETS, seed + 2);
  const threat = seededPick(THREATS, seed + 5);
  const campaign = seededPick(CAMPAIGNS, seed + 9);
  const opening = seededPick(pools.opening, seed)(m);
  const deed = seededPick(pools.deed, seed + 1)(m, planet, threat, campaign);
  const trait = seededPick(pools.trait, seed + 2)(m);
  const closing = seededPick(pools.closing, seed + 3)(m);
  return [opening, deed, trait, closing].join(" ");
}

function generateSampleRoster() {
  const members = [];
  let seed = 1;
  let idn = 0;
  const nextId = () => "m" + String(++idn).padStart(3, "0");

  members.push({
    id: nextId(), name: makeName(seed++), chapter: "Hawk Lords",
    rank: "watch_master", company: null, killTeam: null, formation: null, title: null,
    vigil: "Presiding since the Fortress' founding"
  });

  Object.entries(FORMATIONS).forEach(([key, f]) => {
    members.push({
      id: nextId(), name: makeName(seed++), chapter: seededPick(CHAPTERS, seed + 3),
      rank: f.lead, company: null, killTeam: null, formation: key, title: null,
      vigil: `Leads the ${f.name}`
    });
    f.ranks.forEach(rank => {
      const countFor = rank === "blade_guard" ? 20 : (rank === "kill_marine" ? 8 : 5);
      for (let i = 0; i < countFor; i++) {
        members.push({
          id: nextId(), name: makeName(seed++), chapter: seededPick(CHAPTERS, seed + i),
          rank, company: null, killTeam: null, formation: key, title: null, vigil: null
        });
      }
    });
    if (key === "armory") {
      members.push({
        id: nextId(), name: makeName(seed++), chapter: seededPick(CHAPTERS, seed + 11),
        rank: "venerable_dreadnought", company: null, killTeam: null, formation: key, title: null,
        vigil: "The eldest of the Armory's Dreadnoughts"
      });
    }
  });

  for (let c = 1; c <= 5; c++) {
    members.push({
      id: nextId(), name: makeName(seed++), chapter: seededPick(CHAPTERS, seed + c),
      rank: "watch_captain", company: c, killTeam: null, formation: null, title: null,
      vigil: `Commands Company ${COMPANY_NAMES[c]}`
    });
    members.push({
      id: nextId(), name: makeName(seed++), chapter: seededPick(CHAPTERS, seed + c + 1),
      rank: "watch_lieutenant", company: c, killTeam: null, formation: null, title: null,
      vigil: `Serves Company ${COMPANY_NAMES[c]} command`
    });

    for (let slot = 1; slot <= 4; slot++) {
      const killTeam = `${c}-${slot}`;
      const leadRank = slot % 2 === 0 ? "veteran_sergeant" : "watch_sergeant";
      members.push({
        id: nextId(), name: makeName(seed++), chapter: seededPick(CHAPTERS, seed + slot),
        rank: leadRank, company: c, killTeam, formation: null, title: null,
        vigil: `Leads Kill-team, Company ${COMPANY_NAMES[c]}`
      });
      for (let i = 0; i < 4; i++) {
        const rosterRank = seededPick(KILL_TEAM_ROSTER_RANKS, seed + i);
        members.push({
          id: nextId(), name: makeName(seed++), chapter: seededPick(CHAPTERS, seed + i),
          rank: rosterRank, company: c, killTeam, formation: null, title: null, vigil: null
        });
      }
    }
  }
  members.forEach(m => { m.backstory = makeBackstory(m); });
  return members;
}

const state = {

  killTeamId: null,
  formationId: null,
  members: [],

  dataStatus: "sample",  // 'sample' | 'live' | 'error'
  dataSourceUrl: "",
  auth: { authenticated: false, user: null, csrf: null }
};

const BACKSTORY_MAX_WORDS = 400;
const BACKSTORY_MAX_CHARS = 2400;

const DEFAULT_DATA_SOURCE_URL = window.location.protocol.startsWith("http")
  ? `${window.location.origin}/api/roster` : "";

function hasStorage() {
  return typeof window !== "undefined" && !!window.storage;
}

async function loadSavedSettings() {
  state.dataSourceUrl = DEFAULT_DATA_SOURCE_URL;
}

async function loadData() {
  if (state.dataSourceUrl) {
    try {
      const resp = await fetch(state.dataSourceUrl);
      if (!resp.ok) throw new Error("bad response");
      const json = await resp.json();
      if (!json || !Array.isArray(json.members)) throw new Error("bad shape");
      state.members = json.members;
      state.killTeams = json.killTeams || state.killTeams;
      state.directiveStats = json.directiveStats || state.directiveStats;
      state.dataStatus = "live";
      return;
    } catch (e) {
      console.error("Live fetch failed, falling back to sample data", e);
      state.dataStatus = "error";
    }
  }
  state.members = generateSampleRoster();
  if (state.dataStatus !== "error") state.dataStatus = "sample";
}

async function loadAuth() {
  if (!window.location.protocol.startsWith("http")) {
    state.auth = { authenticated: false, user: null, csrf: null };
    renderAuthButton();
    return state.auth;
  }
  try {
    const resp = await fetch(`${window.location.origin}/api/me`, { credentials: "include" });
    if (!resp.ok) throw new Error("Could not refresh authentication.");
    const auth = await resp.json();
    state.auth = auth && auth.authenticated
      ? auth
      : { authenticated: false, user: null, csrf: null };
  } catch (e) {
    state.auth = { authenticated: false, user: null, csrf: null };
  }
  renderAuthButton();
  return state.auth;
}

function renderAuthButton() {
  const container = document.getElementById("auth-container");
  if (!container) return;
  if (state.auth && state.auth.authenticated && state.auth.user) {
    const name = state.auth.user.name || "Authenticated";
    container.innerHTML = `
      <div class="auth-badge">
        <span class="auth-badge-dot"></span>
        <span>${escapeHtml(name)}</span>
        <button id="auth-logout-btn" class="auth-btn auth-btn-logout" title="Log out" type="button">Logout</button>
      </div>`;
    const logoutBtn = document.getElementById("auth-logout-btn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        fetch(apiUrl("/api/auth/logout"), { credentials: "include" }).finally(() => {
          state.auth = { authenticated: false, user: null, csrf: null };
          renderAuthButton();
        });
      });
    }
  } else {
    container.innerHTML = `<button id="auth-login-btn" class="auth-btn" type="button">Login with Discord</button>`;
    const loginBtn = document.getElementById("auth-login-btn");
    if (loginBtn) {
      loginBtn.addEventListener("click", startDiscordLogin);
    }
  }
}

function apiUrl(path) {
  return `${window.location.origin}${path}`;
}

function startDiscordLogin() {
  window.location.assign(apiUrl("/api/auth/discord/start"));
}

async function saveBackstory(memberId, text) {
  const send = () => fetch(apiUrl("/api/me/backstory"), {
    method: "PATCH", credentials: "include",
    headers: { "Content-Type": "application/json", "X-CSRF-Token": state.auth.csrf },
    body: JSON.stringify({ backstory: text })
  });
  const requireCsrf = async () => {
    const auth = await loadAuth();
    if (!auth.authenticated || !auth.csrf) {
      throw new Error("Your session has expired. Log in again before inscribing your chronicle.");
    }
  };

  await requireCsrf();
  let resp = await send();
  let payload = await resp.json();
  if (resp.status === 403 && payload.error === "csrf_failed") {
    await requireCsrf();
    resp = await send();
    payload = await resp.json();
  }
  if (!resp.ok) {
    const message = payload.error === "csrf_failed"
      ? "The security seal could not be verified. Reload the page and log in again."
      : payload.error || "Could not save backstory.";
    throw new Error(message);
  }
  const member = findMember(memberId);
  if (member) member.backstory = payload.backstory;
  return payload.backstory;
}

function backstoryLimitError(text) {
  const normalized = text.trim();
  const characterCount = normalized.length;
  if (characterCount > BACKSTORY_MAX_CHARS) {
    return `Backstory is too long: ${characterCount.toLocaleString("en-US")}/${BACKSTORY_MAX_CHARS.toLocaleString("en-US")} characters. You're not that guy.`;
  }
  const wordCount = normalized ? normalized.split(/\s+/).length : 0;
  if (wordCount > BACKSTORY_MAX_WORDS) {
    return `Backstory is too long: ${wordCount.toLocaleString("en-US")}/${BACKSTORY_MAX_WORDS.toLocaleString("en-US")} words. You're not that guy.`;
  }
  return "";
}

function companyCommand(companyId) {
  return COMPANY_COMMAND_RANKS.map(rank => ({
    rank, member: state.members.find(m => m.rank === rank && m.company === companyId) || null
  }));
}

function killTeamsForCompany(companyId) {
  const companyMembers = state.members.filter(m => m.company === companyId);
  const catalog = state.killTeams && state.killTeams[String(companyId)];
  if (Array.isArray(catalog) && catalog.length > 0) {
    const teams = [];
    catalog.forEach((team, index) => {
      const roster = companyMembers.filter(m => m.killTeam === team.id || m.killTeamName === team.name || m.killTeam === team.name);
      if (roster.length === 0) return; // Omit completely empty kill teams
      const lead = roster.find(m => KILL_TEAM_LEAD_RANKS.includes(m.rank)) || null;
      teams.push({
        killTeam: team.id,
        slot: index + 1,
        name: team.name,
        lead,
        roster,
        count: roster.length
      });
    });
    return teams;
  }
  const teams = [];
  for (let slot = 1; slot <= 4; slot++) {
    const killTeam = `${companyId}-${slot}`;
    const roster = companyMembers.filter(m => m.killTeam === killTeam);
    if (roster.length === 0) continue; // Omit completely empty kill teams
    const lead = roster.find(m => KILL_TEAM_LEAD_RANKS.includes(m.rank)) || null;
    const namedMember = roster.find(m => m.killTeamName);
    teams.push({
      killTeam,
      slot,
      name: namedMember ? namedMember.killTeamName : `Kill Team ${slot}`,
      lead,
      roster,
      count: roster.length
    });
  }
  return teams;
}

function killTeamDetail(companyId, killTeam) {
  const catalog = (state.killTeams && state.killTeams[String(companyId)]) || [];
  const catalogEntry = catalog.find(t => t.id === killTeam || t.name === killTeam);
  const targetName = catalogEntry ? catalogEntry.name : killTeam;
  const roster = state.members.filter(m => m.company === companyId && (m.killTeam === killTeam || m.killTeamName === targetName || m.killTeam === targetName));
  const lead = roster.find(m => KILL_TEAM_LEAD_RANKS.includes(m.rank)) || null;
  const rest = roster.filter(m => m !== lead);
  const name = catalogEntry ? catalogEntry.name : (roster.find(m => m.killTeamName)?.killTeamName || killTeam);
  return { lead, rest, name };
}

function formationMembers(key) {
  return state.members.filter(m => m.formation === key);
}

function fortressTotal() {
  return state.members.length;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
}

function serviceMetrics(member) {
  if (!member) return { vigilYears: null, studsPips: "—" };
  const vigilYears = Number.isFinite(Number(member.vigilYears)) ? Number(member.vigilYears) : null;
  return { vigilYears, studsPips: member.serviceStudPips || "—" };
}

function imperialDate(year) {
  const millennium = Math.ceil(year / 1000);
  const yearInMillennium = year - ((millennium - 1) * 1000);
  return `${yearInMillennium.toString().padStart(3, "0")}.M${millennium}`;
}

function watchEntryLabel(member) {
  const metrics = serviceMetrics(member);
  if (metrics.vigilYears === null || !member.serverJoinedAt) return "Unrecorded";
  const joinedMs = Date.parse(member.serverJoinedAt);
  if (!Number.isFinite(joinedMs)) return "Unrecorded";
  return imperialDate(Math.max(1, CURRENT_IMPERIAL_YEAR - Math.floor(metrics.vigilYears)));
}

function serviceRecord(member) {
  const metrics = serviceMetrics(member);
  return metrics.vigilYears === null ? "Vigil record pending" : `${metrics.vigilYears} years given to the Long Vigil`;
}

function vigilEntryRecord(member) {
  const entry = watchEntryLabel(member);
  return entry === "Unrecorded" ? "Vigil record pending" : `Joined the Long Vigil ${entry}`;
}

function serviceStudsHtml(member) {
  const pips = String(member.serviceStudPips || "—");
  if (pips === "—") return `<span class="stud-display">—</span>`;
  return `<span class="stud-display">${[...pips].map(pip => `<span class="stud-pip ${pip === "●" ? "auramite" : "plasteel"}" aria-hidden="true">${pip}</span>`).join("")}</span>`;
}

function locationRows(member) {
  if (member.rank === "watch_master") {
    return `<div class="modal-row"><span>Assignment</span><span>Watch Master of Watch Fortress Jericho</span></div>`;
  }
  if (member.company) {
    return `<div class="modal-row"><span>Company</span><span>Company ${escapeHtml(COMPANY_NAMES[member.company])}</span></div>
      ${member.killTeam ? `<div class="modal-row"><span>Kill-team</span><span>${escapeHtml(member.killTeam)}</span></div>` : ""}`;
  }
  if (member.formation) {
    return `<div class="modal-row"><span>Formation</span><span>${escapeHtml(FORMATIONS[member.formation] ? FORMATIONS[member.formation].name : member.formation)}</span></div>`;
  }
  return `<div class="modal-row"><span>Assignment</span><span>Fortress-wide</span></div>`;
}

function plateHtml({ id, member, name, rankLabel, sub, accent, vacant, size }) {
  const cls = ["plate", accent ? `accent-${accent}` : "", vacant ? "vacant" : "", size ? `size-${size}` : ""]
    .filter(Boolean).join(" ");
  const clickAttr = id ? `data-member="${escapeHtml(id)}"` : "";
  return `
    <button class="${cls}" ${clickAttr} ${id ? "" : "disabled"} type="button">
      <span class="plate-rank">${escapeHtml(rankLabel)}</span>
      <span class="plate-name">${vacant ? "Vacant" : escapeHtml(displayName(name))}</span>
      ${sub || serviceRecord(member) ? `<span class="plate-sub">${escapeHtml(sub || serviceRecord(member))}</span>` : ""}
      ${member && member.serverJoinedAt ? `<span class="plate-sub">${escapeHtml(vigilEntryRecord(member))}</span>` : ""}
    </button>`;
}

function renderBreadcrumb() {
  const el = document.getElementById("breadcrumb");
  const parts = [`<button class="crumb" data-nav="strategium">Strategium</button>`];
  if (state.view === "company" || state.view === "killteam") {
    parts.push(`<span class="crumb-sep">&rsaquo;</span>`);
    parts.push(`<button class="crumb" data-nav="company" data-company="${state.companyId}">Company ${COMPANY_NAMES[state.companyId]}</button>`);
  }
  if (state.view === "killteam") {
    const teams = killTeamsForCompany(state.companyId);
    const t = teams.find(t => t.killTeam === state.killTeamId || t.name === state.killTeamId);
    const label = t ? t.name : "Kill-team";
    parts.push(`<span class="crumb-sep">&rsaquo;</span>`);
    parts.push(`<span class="crumb crumb-current">${escapeHtml(label)}</span>`);
  }
  if (state.view === "formation") {
    const f = FORMATIONS[state.formationId];
    parts.push(`<span class="crumb-sep">&rsaquo;</span>`);
    parts.push(`<span class="crumb crumb-current">${escapeHtml(f ? f.name : "Formation")}</span>`);
  }
  el.innerHTML = parts.join("");
}

function renderStrategium() {

    return `

function drawMapConnectors() {
  const map = document.querySelector(".fortress-map");
  const svg = map && map.querySelector(".map-connectors");
  if (!map || !svg || window.innerWidth <= 600) return;

  const mapRect = map.getBoundingClientRect();
  const rectFor = selector => map.querySelector(selector).getBoundingClientRect();
  const bounds = selector => {
    const rect = rectFor(selector);
    return {
      left: rect.left - mapRect.left,
      right: rect.right - mapRect.left,
      top: rect.top - mapRect.top,
      bottom: rect.bottom - mapRect.top,
      centerX: rect.left - mapRect.left + rect.width / 2,
      centerY: rect.top - mapRect.top + rect.height / 2
    };
  };
  const horizontal = (from, to) => {
    const source = bounds(from);
    const target = bounds(to);
    const startX = source.centerX < target.centerX ? source.right : source.left;
    const endX = source.centerX < target.centerX ? target.left : target.right;
    return `<line x1="${startX}" y1="${source.centerY}" x2="${endX}" y2="${target.centerY}"></line>`;
  };
  const vertical = (from, to) => {
    const source = bounds(from);
    const target = bounds(to);
    return `<line x1="${source.centerX}" y1="${source.bottom}" x2="${target.centerX}" y2="${target.top}"></line>`;
  };
  const orthogonal = (from, to, bendY) => {
    const source = bounds(from);
    const target = bounds(to);
    return `<path d="M ${source.centerX} ${source.bottom} L ${source.centerX} ${bendY} L ${target.centerX} ${bendY} L ${target.centerX} ${target.top}"></path>`;
  };
  const command = ".map-command .plate";
  const formation = key => `.formation-slot-${key} .formation-plate`;
  const companySelectors = [1, 2, 3, 4, 5].map(id => `.company-slot-${id} .company-plate`);
  const companies = companySelectors.map(bounds);
  const commandBounds = bounds(command);
  const railY = companies[0].top - 24;
  const middleRect = rectFor(".map-middle");
  const companyRail = `<line x1="${companies[0].centerX}" y1="${railY}" x2="${companies[4].centerX}" y2="${railY}"></line>`;
  const lines = [
    horizontal(command, formation("armory")),
    horizontal(command, formation("apothecarion")),
    vertical(command, formation("librarius")),
    vertical(command, formation("reclusiam")),
    vertical(formation("armory"), formation("black_vault")),
    vertical(formation("apothecarion"), formation("hall_of_blades")),
    `<line x1="${commandBounds.centerX}" y1="${commandBounds.bottom}" x2="${commandBounds.centerX}" y2="${railY}"></line>`,
    companyRail,
    ...companies.map(company => `<line x1="${company.centerX}" y1="${railY}" x2="${company.centerX}" y2="${company.top}"></line>`)
  ];
  svg.setAttribute("viewBox", `0 0 ${mapRect.width} ${mapRect.height}`);
  svg.innerHTML = lines.join("");
}

function render(originPct, direction) {
  renderBreadcrumb();
  if (state.view === "strategium") renderStrategium();
  else if (state.view === "company") renderCompany(state.companyId);
  else if (state.view === "killteam") renderKillTeam(state.companyId, state.killTeamId);
  else if (state.view === "formation") renderFormation(state.formationId);
  updateStatusBadge();

  const app = document.getElementById("app");
  app.classList.remove("zoom-in", "zoom-out");
  void app.offsetWidth; /* force reflow so the animation retriggers */
  if (direction === "in" && originPct) {
    app.style.transformOrigin = `${originPct.x}% ${originPct.y}%`;
    app.classList.add("zoom-in");
  } else {
    app.style.transformOrigin = "50% 12%";
    app.classList.add("zoom-out");
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function updateStatusBadge() {
  const slateCount = document.getElementById("slate-count");

    slateCount.textContent = "ASTARTES ON RECORD: " + fortressTotal();

function navigate(view, params, originEl, direction) {
  params = params || {};
  let originPct = null;
  if (originEl && direction === "in") {
    const rect = originEl.getBoundingClientRect();
    const appRect = document.getElementById("app").getBoundingClientRect();
    originPct = {
      x: appRect.width ? ((rect.left + rect.width / 2 - appRect.left) / appRect.width) * 100 : 50,
      y: appRect.height ? ((rect.top + rect.height / 2 - appRect.top) / appRect.height) * 100 : 50
    };
  }
  state.view = view;
  state.companyId = params.companyId ?? null;
  state.killTeamId = params.killTeamId ?? null;
  state.formationId = params.formationId ?? null;
  render(originPct, direction || "out");
}

function displayName(name) {
  let clean = String(name || "")
    .replace(/[●⚬▬]/g, "")
    .replace(/\s+/g, " ")
    .trim();
  const prefixes = [
    "The Venerable Dreadnought", "The Honored Dreadnought",
    "Venerable Dreadnought", "Chief Apothecary", "Watch Lieutenant", "Watch Librarian",
    "Watch Apothecary", "Watch Techmarine", "Watch Sergeant", "Watch Captain",
    "Veteran Sergeant", "Honored Dreadnought", "High Chaplain", "Blade Master",
    "Forge Master", "Forgemaster", "Hunt Master", "Huntmaster", "Watch Master",
    "First Blade", "Bladeguard", "Watch Veteran", "Watch Brother", "Oathsworn"
  ];
  let changed = true;
  while (changed) {
    changed = false;
    const prefix = prefixes.find(item => clean.toLowerCase().startsWith(`${item.toLowerCase()} `));
    if (prefix) {
      clean = clean.slice(prefix.length).trim();
      changed = true;
    }
  }
  return clean.split(" ").map(word => {
    if (word.length > 1 && (word === word.toUpperCase() || (word[0] === word[0].toLowerCase() && word.slice(1) === word.slice(1).toUpperCase()))) {
      return word[0].toUpperCase() + word.slice(1).toLowerCase();
    }
    return word;
  }).join(" ")
    .replace(/\s+the\s+(honored|venerable)$/i, "")
    .replace(/^Dreadnought\s+/i, "");
}

function dropcapHtml(text) {

    </div>` : "";
  const canEdit = state.auth.authenticated && state.auth.user && String(state.auth.user.id) === String(m.id);

  let backstorySection = "";
  if (isEditing && canEdit) {
    backstorySection = `
      <div class="modal-divider">&#10086;</div>
      <div class="backstory-edit-container">
        <label class="field-label" for="backstory-input">Commune with the Cogitator &middot; Inscribe Vigil Chronicle</label>

        <div class="modal-actions">
          <button id="backstory-cancel-btn" class="btn-dossier-action btn-dossier-cancel" type="button">Cancel</button>

        </div>
        <div id="backstory-status" style="margin-top: 8px; font-size: 11px;"></div>
      </div>
    `;
  } else {
    if (m.backstory) {
      backstorySection += `<div class="modal-divider">&#10086;</div><p class="modal-backstory">${dropcapHtml(m.backstory)}</p>`;
    }
    if (canEdit) {
      backstorySection += `
        <div class="modal-actions">
          <button id="backstory-edit-trigger-btn" class="btn-dossier-action" type="button">&#x270E; Inscribe Chronicle</button>
        </div>
      `;
    }
  }

  document.getElementById("member-modal-body").innerHTML = `
    <div class="modal-heading">
      <div class="modal-rank">${escapeHtml(RANK_LABELS[m.rank] || m.rank)}${m.title ? " \u00b7 " + escapeHtml(m.title) : ""}</div>
      <div class="modal-name">${escapeHtml(displayName(m.name))}</div>
      ${m.serviceStudPips ? `<div class="modal-studs"><div class="modal-studs-label">Service Studs</div>${serviceStudsHtml(m)}</div>` : ""}
    </div>
    <div class="modal-row"><span>Chapter of Origin</span><span>${escapeHtml(m.chapter || "Unrecorded")}</span></div>
    ${locationRows(m)}
    <div class="modal-row"><span>AAR Points</span><span>${escapeHtml(Number.isFinite(Number(m.aarPoints ?? m.stats?.aar_points)) ? Number(m.aarPoints ?? m.stats.aar_points) : "Unrecorded")}</span></div>
    <div class="modal-row"><span>Strike Directives</span><span>${escapeHtml(Number.isFinite(Number(m.strikeDirectives)) ? `${m.strikeDirectives} completed` : (Number.isFinite(Number(m.stats?.strike_directives)) ? `${m.stats.strike_directives} completed` : "0 completed"))}</span></div>
    <div class="modal-row"><span>Years given to the Long Vigil</span><span class="service-years-value">${escapeHtml(m.vigilYears === undefined ? "Unrecorded" : `${m.vigilYears} years`)}</span></div>
    <div class="modal-row"><span>Joined the Long Vigil</span><span>${escapeHtml(watchEntryLabel(m))}</span></div>
    ${statsHtml}
    ${m.vigil ? `<div class="modal-vigil-tag">${escapeHtml(m.vigil)}</div>` : ""}
    ${backstorySection}
  `;

  if (isEditing && canEdit) {
    const input = document.getElementById("backstory-input");
    const count = document.getElementById("backstory-count");
    const saveBtn = document.getElementById("backstory-save-btn");
    const updateCount = () => {
      const normalized = input.value.trim();
      const wordCount = normalized ? normalized.split(/\s+/).length : 0;
      const error = backstoryLimitError(input.value);
      count.textContent = error || `${normalized.length.toLocaleString("en-US")} / 2,400 characters · ${wordCount.toLocaleString("en-US")} / 400 words`;
      count.style.color = error ? "var(--red)" : "";

      renderMemberModalContent(m, false);
    });
  } else if (canEdit) {
    const editBtn = document.getElementById("backstory-edit-trigger-btn");
    if (editBtn) {
      editBtn.addEventListener("click", () => {
        renderMemberModalContent(m, true);
      });
    }
  }
}

    m.name.toLowerCase().includes(q) ||
    (RANK_LABELS[m.rank] || "").toLowerCase().includes(q) ||
    (m.chapter || "").toLowerCase().includes(q)
  ).slice(0, 24);

  if (!matches.length) {
    resultsEl.innerHTML = `<div class="search-hint">No battle-brothers match that search.</div>`;
    return;
  }
  resultsEl.innerHTML = matches.map(m => `
    <button class="search-result" data-member="${m.id}" type="button">
      <span class="search-result-name">${escapeHtml(displayName(m.name))}</span>
      <span class="search-result-meta">${escapeHtml(RANK_LABELS[m.rank] || m.rank)} &middot; ${escapeHtml(memberLocationLabel(m))}</span>
    </button>`).join("");
}

function openSearch() {
  const overlay = document.getElementById("search-overlay");
  const panel = overlay.querySelector(".overlay-panel");
  const input = document.getElementById("search-input");
  input.value = "";
  renderSearchResults("");
  overlay.classList.add("open");
  panel.classList.remove("fade-in");
  void panel.offsetWidth;
  panel.classList.add("fade-in");
  input.focus();
}

function closeSearch() {
  document.getElementById("search-overlay").classList.remove("open");
}

/* ---------------------------------------------------------------------- */
/* Event wiring                                                           */
/* ---------------------------------------------------------------------- */

function wireEvents() {
  window.addEventListener("resize", () => requestAnimationFrame(drawMapConnectors));
  document.body.addEventListener("click", (e) => {
    const navBtn = e.target.closest("[data-nav]");
    if (navBtn) {
      const view = navBtn.dataset.nav;
      const params = {
        companyId: navBtn.dataset.company ? Number(navBtn.dataset.company) : null,
        killTeamId: navBtn.dataset.killteam || null,
        formationId: navBtn.dataset.formation || null
      };
      const isBreadcrumb = navBtn.classList.contains("crumb");
      navigate(view, params, isBreadcrumb ? null : navBtn, isBreadcrumb ? "out" : "in");
      return;
    }
    const memberBtn = e.target.closest("[data-member]");
    if (memberBtn) {
      openMemberModal(memberBtn.dataset.member);
      if (memberBtn.closest("#search-overlay")) closeSearch();
      return;
    }
    const rosterRow = e.target.closest(".roster-row");
    if (rosterRow) {
      openMemberModal(rosterRow.dataset.member);
      return;
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeMemberModal();
      closeSearch();
    }
  });

  document.getElementById("member-modal-close").addEventListener("click", closeMemberModal);
  document.getElementById("member-modal").addEventListener("click", (e) => {
    if (e.target.id === "member-modal") closeMemberModal();
  });

  document.getElementById("search-btn").addEventListener("click", openSearch);
  document.getElementById("search-close-btn").addEventListener("click", closeSearch);
  document.getElementById("search-overlay").addEventListener("click", (e) => {
    if (e.target.id === "search-overlay") closeSearch();
  });
  document.getElementById("search-input").addEventListener("input", (e) => {
    renderSearchResults(e.target.value);
  });
}

/* ---------------------------------------------------------------------- */
/* Init                                                                    */
/* ---------------------------------------------------------------------- */

async function init() {
  wireEvents();
  await loadSavedSettings();
  await loadData();
  await loadAuth();
  render();
}

init();

</script>
</body>
</html>
